[package]
name = "agentos-console"
version = "0.1.0"
description = "Native macOS shell for AgentOS Console"
authors = ["konicatc"]
edition = "2021"

[lib]
name = "agentos_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
